<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Me Puzzle</title>
<meta name="description" content="Türkçe ve İngilizce kelime bulmaca oyunu. 5 ile 8 harfli kelimeleri 5 veya 6 denemede bul. / A Turkish and English word puzzle game.">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1317" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Find Me Puzzle">
<meta property="og:description" content="Türkçe ve İngilizce kelime bulmaca oyunu. / A Turkish and English word puzzle game.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <main>
    <header>
      <div class="brand">
        <div class="mark" aria-hidden="true"><i class="g"></i><i class="y"></i><i class="m"></i></div>
        <h1>Find Me Puzzle</h1>
      </div>
      <button class="icon-btn gear" id="openBtn" type="button" aria-controls="panel" data-i18n-label="settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </header>

    <div class="hud" id="hud">
      <div class="hud-item">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>
        <b class="clock" id="clock" role="timer">00:00</b>
      </div>
      <div class="hud-item now" id="nowItem" data-level="high">
        <span class="hud-label" data-i18n="roundCoin"></span>
        <b id="nowCoins">10</b>
      </div>
      <div class="hud-item total">
        <svg class="coin" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--coin)"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="var(--on-state)" stroke-width="1.6" opacity="0.85"/></svg>
        <b id="totalCoins">0</b>
      </div>
    </div>

    <p class="goal" id="goal"></p>
    <div class="board-wrap">
      <div class="board" id="board" aria-label="Oyun tahtası"></div>
      <div class="start" id="startOverlay">
        <button class="primary big" id="startBtn" type="button" disabled></button>
        <p class="start-hint" id="startHint"></p>
      </div>
    </div>

    <div class="status">
      <p id="msg" role="status" aria-live="polite"></p>
      <button class="primary" id="nextBtn" type="button" hidden></button>
    </div>

    <div class="kb" id="kb"></div>
  </main>

  <div id="scrim"></div>
  <aside class="panel" id="panel" aria-label="Ayarlar">
    <div class="panel-head">
      <h2 data-i18n="settings"></h2>
      <button class="icon-btn" id="closeBtn" type="button" data-i18n-label="close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <section>
      <p class="label" data-i18n="lang"></p>
      <div class="seg" data-group="lang">
        <button type="button" data-val="tr">Türkçe</button>
        <button type="button" data-val="en">English</button>
      </div>
    </section>

    <section>
      <p class="label" data-i18n="length"></p>
      <div class="seg" data-group="len">
        <button type="button" data-val="5">5</button>
        <button type="button" data-val="6">6</button>
        <button type="button" data-val="7">7</button>
        <button type="button" data-val="8">8</button>
      </div>
    </section>

    <section>
      <p class="label" data-i18n="tries"></p>
      <div class="seg" data-group="tries">
        <button type="button" data-val="5">5</button>
        <button type="button" data-val="6">6</button>
      </div>
    </section>

    <section>
      <p class="label" data-i18n="howto"></p>
      <ul class="legend">
        <li><span class="tile good" aria-hidden="true">A</span><span data-i18n="good"></span></li>
        <li><span class="tile near" aria-hidden="true">B</span><span data-i18n="near"></span></li>
        <li><span class="tile miss" aria-hidden="true">C</span><span data-i18n="miss"></span></li>
      </ul>
    </section>

    <section>
      <p class="label" data-i18n="points"></p>
      <ul class="rules" id="rules"></ul>
    </section>

    <section>
      <p class="label" data-i18n="stats"></p>
      <div class="stats">
        <div class="stat"><b id="stPlayed">0</b><span data-i18n="played"></span></div>
        <div class="stat"><b id="stWon">0</b><span data-i18n="won"></span></div>
        <div class="stat"><b id="stStreak">0</b><span data-i18n="streak"></span></div>
      </div>
    </section>

    <button class="primary" id="newBtn" type="button" data-i18n="newWord"></button>
    <p class="credit" data-i18n="credit"></p>
  </aside>
</div>

<script src="app.js"></script>
</body>
</html>
